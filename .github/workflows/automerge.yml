name: automerge (reusable)

# Reusable auto-merge workflow for Renovate PRs across twistymaze repos.
# Called by each auto-merge repo's thin caller workflow. Enables GitHub
# auto-merge (squash) on a Renovate PR once its required checks pass.
#
# Security: 3-layer gate — (1) PR head is this same repo (no fork PRs),
# (2) author is the unforgeable renovate[bot] identity, (3) the 'automerge'
# label, which only write-holders / Renovate can apply. Callers trigger on
# `pull_request` (not pull_request_target) and no PR code is checked out or
# executed, so fork PRs get a read-only token and the RCE class doesn't apply.
#
# Copilot handoff: when Copilot cloud agent pushes fixes to a Renovate PR,
# auto-merge is turned off so a green intermediate commit can't merge while
# Copilot is still working. When Copilot finishes it requests a review; that
# event turns auto-merge back on, pinned to Copilot's final commit. Other
# non-Renovate pushes don't re-enable auto-merge. Callers must include
# `review_requested` in their pull_request trigger types.

on:
  workflow_call:
    inputs:
      app-client-id:
        description: Optional GitHub App client ID; requires app-private-key.
        type: string
        default: ''
    secrets:
      automerge-token:
        description: Optional token used instead of GITHUB_TOKEN; cannot be combined with App credentials.
        required: false
      app-private-key:
        description: Optional GitHub App private key; requires app-client-id.
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      !contains(github.event.pull_request.labels.*.name, 'manual-review') &&
      (github.event.action != 'synchronize' ||
        contains(fromJSON('["renovate[bot]","Copilot","copilot-swe-agent[bot]"]'), github.event.sender.login)) &&
      (github.event.action != 'review_requested' ||
        contains(fromJSON('["Copilot","copilot-swe-agent[bot]"]'), github.event.sender.login))
    runs-on: ubuntu-latest
    steps:
      - name: Validate authentication configuration
        env:
          APP_CLIENT_ID: ${{ inputs.app-client-id }}
          APP_PRIVATE_KEY: ${{ secrets.app-private-key }}
          CUSTOM_TOKEN: ${{ secrets.automerge-token }}
        shell: bash
        run: |
          if [[ -n "$APP_CLIENT_ID" && -z "$APP_PRIVATE_KEY" ]] ||
             [[ -z "$APP_CLIENT_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo '::error::Set both app-client-id and app-private-key, or neither.'
            exit 1
          fi
          if [[ -n "$CUSTOM_TOKEN" && -n "$APP_CLIENT_ID" ]]; then
            echo '::error::Choose either automerge-token or GitHub App credentials.'
            exit 1
          fi

      - name: Create repository-scoped GitHub App token
        if: ${{ inputs.app-client-id != '' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Disable auto-merge while Copilot is working
        if: >
          github.event.action == 'synchronize' &&
          github.event.sender.login != 'renovate[bot]'
        run: |
          if [[ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" == "true" ]]; then
            gh pr merge --disable-auto "$PR_URL"
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.automerge-token || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Enable squash auto-merge
        if: >
          github.event.action != 'synchronize' ||
          github.event.sender.login == 'renovate[bot]'
        run: gh pr merge --auto --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.automerge-token || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
